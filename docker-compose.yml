version: '3.8'

services:
  mongodb:
    image: mongo:6.0
    container_name: sentinel_mongo
    restart: always
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: weather_sentinel_ai
    volumes:
      - mongo_data:/data/db

  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: sentinel_backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - MONGO_URI=mongodb://mongodb:27017/weather_sentinel_ai
      - JWT_SECRET=weather-sentinel-ultra-secret-jwt-key-sih-2026
      - ML_SERVICE_URL=http://ml-service:8000
      - MODEL_MODE=mock
      - CLIENT_URL=http://localhost:5173
    depends_on:
      - mongodb

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: sentinel_frontend
    restart: always
    ports:
      - "5173:80"
    depends_on:
      - backend

  ml-service:
    build:
      context: ./ml-service
      dockerfile: Dockerfile
    container_name: sentinel_ml_service
    restart: always
    ports:
      - "8000:8000"

volumes:
  mongo_data:
